[tool]
id=math
name=Math
place=menu
files=*.tex
options=need-doc
type=exe
input=selection
output=insert
filter=none
accel=Alt+M
enabled=1
[code]
# Wraps the selection in inline-maths dollars.  medit did this in Lua and,
# with nothing selected, inserted "$ $" and put the caret between them; a
# shell tool cannot place a caret, so with no selection this leaves "$$" and
# the caret after it.
printf %s "\$$(cat)\$"
