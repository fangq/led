[tool]
id=dvi-forward-search
name=DVI Forward Search
place=context
files=*.tex
options=need-file
type=exe
input=none
output=async
filter=none
enabled=1
[code]
# Jump to the place in the DVI that matches the caret.  This needs a viewer
# that understands source specials and can be told a line; medit used kdvi
# through dcop, which is long gone.  Modern viewers take the position on the
# command line, so try the two that do and fall back to just opening it.
[ -f led-env.sh ]   && . ./led-env.sh
[ -f medit-env.sh ] && . ./medit-env.sh
doc="${LATEX_MASTER:-$DOC}"
base=$(basename "$doc" .tex)
if command -v okular > /dev/null; then
  okular --unique "file:$base.dvi#src:$LINE $DOC"
elif command -v evince > /dev/null; then
  evince "$base.dvi"
else
  xdg-open "$base.dvi"
fi
