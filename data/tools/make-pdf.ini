[tool]
id=make-pdf
name=Make PDF
place=menu
files=*.tex
options=need-save
type=exe
input=none
output=pane
filter=latex
enabled=1
[code]
[ -f led-env.sh ]   && . ./led-env.sh
[ -f medit-env.sh ] && . ./medit-env.sh
doc="${LATEX_MASTER:-$DOC}"
base=$(basename "$doc" .tex)
latex --src-specials "$doc" && dvips "$base.dvi" && ps2pdf "$base.ps"
