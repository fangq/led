[tool]
id=latex
name=LaTeX
place=menu
files=*.tex
options=need-save
type=exe
input=none
output=pane
filter=latex
accel=Ctrl+Shift+L
enabled=1
[code]
# A multi-file document builds from its master, not from whichever chapter
# happens to be open.  Name it in led-env.sh beside the sources:
#     LATEX_MASTER=thesis.tex
# medit-env.sh is read too, so a directory set up for medit still works.
[ -f led-env.sh ]   && . ./led-env.sh
[ -f medit-env.sh ] && . ./medit-env.sh
doc="${LATEX_MASTER:-$DOC}"
latex --src-specials "$doc"
