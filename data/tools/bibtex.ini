[tool]
id=bibtex
name=BibTeX
place=menu
files=*.tex
type=exe
input=none
output=pane
filter=latex
accel=Ctrl+Shift+B
enabled=1
[code]
# medit shipped this one named "LaTeX" as well, which left two identical
# entries in the menu; it runs bibtex, so it says so.
[ -f led-env.sh ]   && . ./led-env.sh
[ -f medit-env.sh ] && . ./medit-env.sh
doc="${LATEX_MASTER:-$DOC}"
bibtex "$(basename "$doc" .tex)"
