[tool]
id=view-dvi
name=View DVI
place=menu
files=*.tex
type=exe
input=none
output=async
filter=none
accel=Ctrl+Shift+V
enabled=1
[code]
# medit drove kdvi over dcop, then fell back to xdg-open.  Only the fallback
# survives: dcop was KDE 3, and the desktop has had one way to open a file
# for fifteen years.
[ -f led-env.sh ]   && . ./led-env.sh
[ -f medit-env.sh ] && . ./medit-env.sh
doc="${LATEX_MASTER:-$DOC}"
xdg-open "$(basename "$doc" .tex).dvi"
