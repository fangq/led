[tool]
id=switch-header
name=Switch Header and Implementation
place=context
langs=c,cpp,chdr,cpphdr,objc
options=need-file
type=exe
input=none
output=none
filter=none
accel=Ctrl+Shift+H
enabled=1
[code]
# medit wrote this in Lua and called editor.open_path.  led has no script
# engine yet, but it does have single-instance hand-off: running "led FILE"
# opens the file in the window that is already up, so a shell tool can do
# the same job.  medit's own Diff to Disk works this way too -- it invokes
# medit to show the diff.
base="${DOC_PATH%.*}"
ext="${DOC##*.}"

case "$ext" in
  h|hh|hpp|hxx|H)        try=".c .cc .cpp .cxx .C .m .mm" ;;
  c|cc|cpp|cxx|C|m|mm)   try=".h .hh .hpp .hxx .H" ;;
  gd)                    try=".gi" ;;
  gi)                    try=".gd" ;;
  *)                     exit 0 ;;
esac

for e in $try; do
  if [ -f "$base$e" ]; then
    exec led "$base$e"
  fi
done
