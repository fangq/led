name: Fetch and build Parade
description: >
  The visual editor (View > Visual Editor, the PDF viewer, presentations) is
  Parade's, and led's Makefile builds it in only when a Parade tree sits
  beside this one.  This clones fangq/parade into ../parade -- the folder the
  Makefile looks in first, and the name a plain `git clone` gives it -- and
  runs `make parade`, which builds libparade.a there and copies it with the
  Pascal units into lib/parade.  A lazbuild of app/led.lpi after this has the
  editor; without it, the empty stub.

inputs:
  ref:
    description: The Parade branch or tag to build against.
    required: false
    default: main
  cc:
    description: >
      The C compiler.  Windows runners have MinGW gcc but no `cc`, so pass gcc
      there; the Makefile also takes gcc's C runtime from it.
    required: false
    default: cc

runs:
  using: composite
  steps:
    - name: Clone Parade
      shell: bash
      run: |
        git clone -q --depth 1 --branch "${{ inputs.ref }}" https://github.com/fangq/parade.git ../parade
        git -C ../parade log -1 --format='Parade %h %s'

    - name: Build Parade into lib/parade
      shell: bash
      run: |
        MAKE_CMD=make
        if [ "$RUNNER_OS" = Windows ]; then
          # The Lazarus installer puts FPC's bin first on PATH, and that has a
          # gcc 2.95 with no C headers.  The runner's MinGW-w64 goes in front
          # of it: wherever this image keeps one, or installed if none.
          for d in /c/mingw64/bin /c/msys64/mingw64/bin /c/msys64/ucrt64/bin; do
            if [ -x "$d/gcc.exe" ]; then MINGW=$d; break; fi
          done
          if [ -z "$MINGW" ]; then
            choco install -y --no-progress mingw >/dev/null
            MINGW=/c/ProgramData/mingw64/mingw64/bin
          fi
          export PATH="$MINGW:$PATH"
          [ -x "$MINGW/mingw32-make.exe" ] && MAKE_CMD=mingw32-make
          echo "MinGW-w64: $MINGW"
        fi
        # FPC links led for macOS 11; Parade built for the same, not for the
        # runner's own version.
        [ "$RUNNER_OS" = macOS ] && export MACOSX_DEPLOYMENT_TARGET=11.0
        command -v "${{ inputs.cc }}"
        "${{ inputs.cc }}" --version | head -1
        "$MAKE_CMD" parade CC="${{ inputs.cc }}"
        ls -l lib/parade
        test -f lib/parade/led.parade.inc
