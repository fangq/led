name: Package

# Builds the desktop installers and uploads them as workflow artifacts:
#   Linux   -> .deb + a portable .tar.gz
#   Windows -> Inno Setup .exe (unsigned) + a portable .zip
#   macOS   -> .dmg holding led.app
# Runs on every push to main, on pull requests, on version tags and on
# demand, so an installer for any commit is always one click away in the
# Actions tab.  Untagged builds are versioned 0.5.0~git<sha>.  Tag pushes
# (v*) additionally attach the installers to a GitHub Release.
#
# This costs roughly six runner-minutes a commit.  That is the price of
# never having to tag, or remember to dispatch, in order to hand someone a
# build -- and packaging breaks in a way compiling does not, so it is worth
# finding on the commit that caused it rather than at release time.
#
# led reads its grammars, themes, word list, shipped tools and bundled fonts
# from a data directory at run time, so every package here has to carry data/
# as well as the binary -- a packager that ships only the executable produces
# an editor that opens every file as plain text, spell-checks against nothing
# and falls back to whatever the desktop calls "Monospace".
#
# Each job therefore checks its own artifact before uploading it.  That is not
# belt and braces: the list of data subdirectories used to be written out in
# six places, and the Windows portable zip had quietly been shipping without
# data/dict in it.  Packaging fails silently -- the build is green and the
# download is simply missing something -- so it has to be asserted.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# needed for the tag-only "attach to release" steps
permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------- Linux .deb
  linux-deb:
    name: linux (.deb + tar.gz)
    # Ubuntu 22.04 with the distribution's Lazarus, for the same reason CI
    # uses it: setup-lazarus downloads from SourceForge, which stalls, and a
    # release build should not fail because a mirror was slow.  It also means
    # the .deb is built against the oldest toolchain led supports rather than
    # the newest, which is the safer direction for something people install.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lazarus-apt

      - name: Build editor (Release)
        run: lazbuild --widgetset=gtk2 --build-mode=Release app/led.lpi

      # Measured on this binary: 8.2 MB -> 1.7 MB, and the packed executable
      # passes the whole self-test, all 536 checks.  Both the .deb and the
      # portable tarball install from bin/led, so packing it here covers
      # both.  apt's lists were refreshed by the lazarus-apt step above.
      #
      # Three checks, because none of them alone is enough.  -t reads the
      # packed file back; -d into a copy and cmp against the original proves
      # it restores the exact bytes that were tested; running it proves the
      # unpacking stub works, which neither of the others touches.
      #
      # Under xvfb, despite --version being answered before the command line
      # reaches the LCL: the gtk2 widgetset opens the display in its unit
      # initialisation, so a bare --version exits 1 with "cannot open
      # display" on a headless runner.  It passes on a desktop, which is
      # exactly how this got committed broken.
      - name: Compress the binary (UPX)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y upx-ucl
          before=$(stat -c%s bin/led)
          cp bin/led "$RUNNER_TEMP/led.orig"
          upx --best --lzma bin/led
          upx -t bin/led
          upx -d -o "$RUNNER_TEMP/led.back" bin/led
          cmp "$RUNNER_TEMP/led.orig" "$RUNNER_TEMP/led.back"
          xvfb-run -a ./bin/led --version
          echo "led: $before -> $(stat -c%s bin/led) bytes"

      - name: Compute version
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
          else
            ver="0.5.0~git$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "building version $ver"

      - name: Build .deb and portable tar.gz
        # The same script `make deb` runs, so this path is exercised on a
        # laptop and not only in CI.
        run: packaging/linux/build-deb.sh "$PWD" "$VERSION"

      - name: The package carries data/
        run: |
          deb=$(ls dist/*.deb)
          for sub in grammars themes tools langs dict fonts; do
            dpkg-deb -c "$deb" | grep -q "usr/share/led/$sub/" \
              || { echo "$deb has no data/$sub" >&2; exit 1; }
          done
          dpkg-deb -c "$deb" | grep -q "fonts/OFL.txt" \
            || { echo "the fonts ship without their licence" >&2; exit 1; }
          tgz=$(ls dist/*.tar.gz)
          for sub in grammars themes tools langs dict fonts; do
            tar tzf "$tgz" | grep -q "/data/$sub/" \
              || { echo "$tgz has no data/$sub" >&2; exit 1; }
          done
          echo "deb and tarball both carry every data directory"

      - uses: actions/upload-artifact@v4
        with:
          name: led-linux-deb
          path: dist/*.deb
          if-no-files-found: error

      # upload-artifact always wraps its contents in a zip, so uploading the
      # tarball directly would nest archives.  The loose staged tree is what
      # produces one usable download.
      - uses: actions/upload-artifact@v4
        with:
          name: led-linux-portable
          path: led-*-linux-x86_64/**
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.deb
            dist/*.tar.gz

  # ---------------------------------------------------------- Windows (Inno)
  windows-inno:
    name: windows (Inno Setup .exe)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # setup-lazarus fetches the installer from SourceForge, and a stalled
      # mirror is the single commonest reason a packaging run fails -- it
      # took one out fifteen minutes into a download.  There is no apt here
      # to fall back on, which is what the Linux job does instead, so give a
      # stall one more go rather than losing the run to it.  The first
      # attempt is continue-on-error so its failure is recorded rather than
      # fatal; the second is not, so a genuinely broken install still fails.
      #
      # Not with-cache: true.  On a cache miss the action logs the download
      # and then mounts the file it did not fetch -- "hdiutil: attach failed
      # - No such file or directory" -- so caching turns a slow macOS job
      # into a broken one.
      - name: Install Lazarus + FPC
        id: lazarus
        uses: gcarreno/setup-lazarus@v3.4.1
        continue-on-error: true
        # Shorter than the second attempt on purpose: a healthy download
        # takes seconds, so waiting the full fifteen minutes on a stall
        # before even trying again spends most of the job's budget.
        timeout-minutes: 8
        with:
          lazarus-version: stable

      # setup-lazarus will not download over a file that is already there,
      # and an attempt killed by the timeout leaves a partial one behind --
      # so without this the second attempt fails instantly with
      # "Destination file path ... already exists" and the retry is useless.
      - name: Clear the half-finished download
        if: steps.lazarus.outcome == 'failure'
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/installers"

      - name: Install Lazarus + FPC (second attempt)
        if: steps.lazarus.outcome == 'failure'
        uses: gcarreno/setup-lazarus@v3.4.1
        timeout-minutes: 15
        with:
          lazarus-version: stable

      - name: Build editor (Release)
        shell: bash
        run: lazbuild --widgetset=win32 --build-mode=Release app/led.lpi

      # As on Linux, and for the same reason: the Inno installer and the
      # portable zip both take bin\led.exe.
      #
      # Pinned to UPX 3.96.  Chocolatey's current 5.2.1 refuses this binary
      # outright -- "CantPackException: TLS empty region" -- because FPC
      # emits a TLS directory whose region is empty and the newer PE packer
      # rejects it.  --force would get past that, but a forced pack of a
      # structure the packer does not understand is not something to put in
      # an installer.
      #
      # No run check: a Lazarus win32 binary is built for the GUI subsystem
      # and gets no console, so WriteLn has nowhere to go and the check
      # would fail on a good executable.  -t and the decompress-and-compare
      # are what stand in for it.
      #
      # No byte-compare against the unpacked file either, which the Linux
      # step does do.  UPX restores an ELF exactly; its PE unpacker rebuilds
      # an equivalent executable rather than the original bytes, so a
      # compare fails on a perfectly good pack -- first at offset 214 in the
      # optional header, and still at 7.6 MB once the headers were skipped.
      # Size is asserted instead, so a truncated or partial round trip is
      # still caught, and upx -t reads the packed file back.
      - name: Compress the binary (UPX)
        shell: bash
        run: |
          choco install upx -y --no-progress --version=3.96
          before=$(stat -c%s bin/led.exe)
          upx --best --lzma bin/led.exe
          upx -t bin/led.exe
          upx -d -o "$RUNNER_TEMP/led.back.exe" bin/led.exe
          back=$(stat -c%s "$RUNNER_TEMP/led.back.exe")
          [ "$before" = "$back" ] || { echo "unpacked size $back, expected $before" >&2; exit 1; }
          echo "led.exe: $before -> $(stat -c%s bin/led.exe) bytes"

      - name: Compute version
        shell: bash
        run: |
          # Keep the Windows installer version CLEAN (no '~', no per-commit
          # hash).  A stable "led-setup-<ver>.exe" name lets the file accrue
          # SmartScreen reputation across downloads instead of looking brand
          # new every commit.
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
          else
            ver="0.5.0"
          fi
          vernum="$(printf '%s' "$ver" | grep -oE '^[0-9]+(\.[0-9]+)*')"
          [ -z "$vernum" ] && vernum="0.5.0"
          IFS='.' read -r a b c d <<< "$vernum"
          d="${d%%.*}"    # PE VersionInfo allows four components
          vernum="${a:-2}.${b:-0}.${c:-0}.${d:-0}"
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "VERNUM=$vernum" >> "$GITHUB_ENV"
          echo "building version $ver (VersionInfo $vernum)"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" "/DAppVerNumeric=$env:VERNUM" `
                  "/DSrcDir=$($PWD.Path)" "packaging\windows\led.iss"
          Get-ChildItem dist

      - name: Stage portable files
        shell: pwsh
        run: |
          $stage = "led-$env:VERSION-win64"
          New-Item -ItemType Directory -Force -Path "$stage\bin" | Out-Null
          Copy-Item bin\led.exe "$stage\bin\"
          # data\ must sit next to the executable's folder; led looks for
          # <exe>\data on Windows.
          # All of data\, not a list of subdirectories: this copy had already
          # fallen behind and was shipping a portable zip with no data\dict
          # in it at all, so spell-check found no words.
          Copy-Item -Recurse data\* `
                    -Destination (New-Item -ItemType Directory -Force -Path "$stage\bin\data")
          Copy-Item README.md, PARITY.md $stage -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "$stage\*" `
            -DestinationPath "dist\led-$env:VERSION-win64.zip" -Force
          Get-ChildItem dist

      - name: The portable tree carries data
        shell: bash
        run: |
          stage=$(ls -d led-*-win64 | head -1)
          for sub in grammars themes tools langs dict fonts; do
            [ -d "$stage/bin/data/$sub" ] \
              || { echo "$stage has no data/$sub" >&2; exit 1; }
          done
          [ -f "$stage/bin/data/fonts/OFL.txt" ] \
            || { echo "the fonts ship without their licence" >&2; exit 1; }
          echo "the portable tree carries every data directory"

      - uses: actions/upload-artifact@v4
        with:
          name: led-windows-setup
          path: dist/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: led-windows-portable
          path: led-*-win64/**
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip

  # -------------------------------------------------------------- macOS .dmg
  macos-dmg:
    name: macos (.dmg)
    # Pinned to macOS 14 for the same reason as CI: setup-lazarus' .pkg does
    # not install on macos-latest.
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # setup-lazarus fetches the installer from SourceForge, and a stalled
      # mirror is the single commonest reason a packaging run fails -- it
      # took one out fifteen minutes into a download.  There is no apt here
      # to fall back on, which is what the Linux job does instead, so give a
      # stall one more go rather than losing the run to it.  The first
      # attempt is continue-on-error so its failure is recorded rather than
      # fatal; the second is not, so a genuinely broken install still fails.
      #
      # Not with-cache: true.  On a cache miss the action logs the download
      # and then mounts the file it did not fetch -- "hdiutil: attach failed
      # - No such file or directory" -- so caching turns a slow macOS job
      # into a broken one.
      - name: Install Lazarus + FPC
        id: lazarus
        uses: gcarreno/setup-lazarus@v3.4.1
        continue-on-error: true
        # Shorter than the second attempt on purpose: a healthy download
        # takes seconds, so waiting the full fifteen minutes on a stall
        # before even trying again spends most of the job's budget.
        timeout-minutes: 8
        with:
          lazarus-version: stable

      # setup-lazarus will not download over a file that is already there,
      # and an attempt killed by the timeout leaves a partial one behind --
      # so without this the second attempt fails instantly with
      # "Destination file path ... already exists" and the retry is useless.
      - name: Clear the half-finished download
        if: steps.lazarus.outcome == 'failure'
        shell: bash
        run: rm -rf "${RUNNER_TEMP}/installers"

      - name: Install Lazarus + FPC (second attempt)
        if: steps.lazarus.outcome == 'failure'
        uses: gcarreno/setup-lazarus@v3.4.1
        timeout-minutes: 15
        with:
          lazarus-version: stable

      - name: Build editor (Release)
        run: lazbuild --widgetset=cocoa --build-mode=Release app/led.lpi

      - name: Compute version
        run: |
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF#refs/tags/v}"
          else
            ver="0.5.0~git$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$ver" >> "$GITHUB_ENV"
          echo "building version $ver"

      - name: Build led.app + .dmg
        run: packaging/macos/build-app.sh "$PWD" "$VERSION"

      # The .dmg, not the staging tree: build-app.sh assembles led.app inside
      # a mktemp directory and only the image survives, so the image is also
      # the only thing there is to check -- and it is what people download.
      - name: The disk image carries data/
        run: |
          dmg=$(ls dist/*.dmg)
          mnt=$(mktemp -d)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt"
          rc=0
          for sub in grammars themes tools langs dict fonts; do
            [ -d "$mnt/led.app/Contents/Resources/data/$sub" ] \
              || { echo "$dmg has no data/$sub" >&2; rc=1; }
          done
          [ -f "$mnt/led.app/Contents/Resources/data/fonts/OFL.txt" ] \
            || { echo "the fonts ship without their licence" >&2; rc=1; }
          hdiutil detach "$mnt" || true
          [ $rc -eq 0 ] || exit 1
          echo "led.app in the image carries every data directory"

      - uses: actions/upload-artifact@v4
        with:
          name: led-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
