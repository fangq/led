name: CI

# Cross-platform from the first commit, not bolted on later: the whole point
# of the Lazarus rewrite is that one source tree compiles everywhere, and that
# only stays true if every push proves it.
#
# The Linux jobs install Lazarus from apt rather than through
# gcarreno/setup-lazarus.  That action downloads the Lazarus .deb from
# SourceForge, which stalls often enough to matter: on run 33530475795 it sat
# there for fifteen minutes and failed a required job on a push whose code was
# fine, and before the timeouts existed it held a runner for an hour and a half
# and blocked `gh run view --log` for every other job in the same workflow.
# apt has no such dependency and finishes in seconds.  Windows and macOS have
# no apt, so they still use the action -- with a timeout, so a stall fails fast
# and names the step that did it.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ubuntu 22.04 is pinned deliberately: it is what fixes the Lazarus version
  # at 2.2, which is both the oldest release led supports and the only one
  # that exercises packages/ledsyn/vendor -- the TextMate engine ships with
  # Lazarus 3 and later, so on anything newer the vendored copy and its
  # version shims are never compiled at all.
  linux:
    name: build & test (ubuntu 22.04 / ${{ matrix.widgetset }})
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    # qt5 needs libqt5pas, which is not in every distro's default set.  A
    # missing binding library should read as "not available here", not as
    # "led is broken", so that one entry is allowed to fail.
    continue-on-error: ${{ matrix.optional || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { widgetset: gtk2 }
          - { widgetset: qt5, optional: true }
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lazarus-apt

      - name: Install libqt5pas (qt5 only)
        if: matrix.widgetset == 'qt5'
        run: sudo apt-get install -y libqt5pas-dev

      - name: Build editor (Release)
        run: lazbuild --widgetset=${{ matrix.widgetset }} --build-mode=Release app/led.lpi

  # Windows and macOS have no distribution package, so these two are the only
  # jobs left depending on the download.  The step timeout is what turns a
  # stall into a failure that names itself rather than a six-hour hang.
  desktop:
    name: build & test (${{ matrix.os }} / ${{ matrix.widgetset }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, widgetset: win32 }
          # Pinned to macOS 14 (Sonoma): setup-lazarus' prebuilt Lazarus .pkg
          # installs there, but macos-latest (15 / Sequoia) rejects it as
          # "incompatible with this version of macOS".
          - { os: macos-14,       widgetset: cocoa }
    steps:
      - uses: actions/checkout@v5

      - name: Install Lazarus + FPC
        uses: gcarreno/setup-lazarus@v3.4.1
        timeout-minutes: 15
        with:
          lazarus-version: stable

      - name: Tool versions
        shell: bash
        run: |
          fpc -iV
          lazbuild --version

      - name: Build editor (Release)
        shell: bash
        run: lazbuild --widgetset=${{ matrix.widgetset }} --build-mode=Release app/led.lpi

  core-tests:
    name: headless core tests (nogui)
    # ledcore must stay free of any visual dependency; building the runner
    # with the nogui widgetset is what enforces that.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lazarus-apt
      - name: Build headless tests
        run: lazbuild --widgetset=nogui test/ledcoretest.lpi
      - name: Run headless tests
        run: ./bin/ledcoretest --all --format=plain

  grammars:
    name: grammar gate
    # Every converted grammar must load in the engine the editor uses.  A
    # converter that emits plausible JSON the engine then rejects is worse
    # than one that fails loudly.  On 2.2 this runs through the vendored
    # engine, which is the only place that code is exercised.
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lazarus-apt
      - name: Regenerate grammars from the .lang sources
        run: python3 tools/lang2tm.py data/langs data/grammars
      - name: Build the checker
        run: lazbuild --widgetset=nogui tools/langcheck/langcheck.lpi
      - name: Check every grammar loads
        run: ./bin/langcheck data/grammars

  conpty:
    name: Windows terminal backend type-checks
    # led.term.pty.conpty.inc is Windows-only code, and the developer's
    # machine has no Windows cross-toolchain.  This compiles it against a
    # mirror of FPC's Win32 declarations on Linux, so a typo in it is caught
    # here rather than by the Windows job several minutes later.
    #
    # apt, not gcarreno/setup-lazarus: this job was written with that action
    # and sat inside it for two hours and twenty-four minutes on its first
    # real run, which is the stall .github/actions/lazarus-apt exists to
    # avoid.  It also needs no Lazarus at all -- make conpty calls fpc
    # directly -- but the composite action is the pattern every other Linux
    # job here uses and it brings fpc with it.  timeout-minutes so the next
    # hang fails in a quarter of an hour rather than sitting there.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lazarus-apt
      - name: Type-check ConPTY
        run: make conpty

  gui-self-test:
    name: scripted GUI self-test (xvfb)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/lazarus-apt
      - name: Build editor
        run: lazbuild --widgetset=gtk2 --build-mode=Release app/led.lpi
      # The self-test uses a configuration directory of its own, so this
      # reports led's behaviour and not the runner's leftovers.
      - name: Run scripted GUI self-test
        run: xvfb-run -a ./bin/led --self-test

  # The newest Lazarus, which is where the *other* half of the vendored
  # engine's shims compile: the branch taken when the base class already has
  # GetInstanceLanguageName and CurrentLineText.  Allowed to fail, because it
  # is now the only Linux job that depends on the SourceForge download, and a
  # stall there says nothing about led.
  newest-lazarus:
    name: newest Lazarus (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - name: Install Lazarus + FPC
        uses: gcarreno/setup-lazarus@v3.4.1
        timeout-minutes: 15
        with:
          lazarus-version: stable
      - name: Tool versions
        run: |
          fpc -iV
          lazbuild --version | tail -1
      - name: Build editor
        run: lazbuild --widgetset=gtk2 --build-mode=Release app/led.lpi
      - name: Headless core tests
        run: |
          lazbuild --widgetset=nogui test/ledcoretest.lpi
          ./bin/ledcoretest --all --format=plain
      # On a Lazarus that ships the TextMate engine itself, this is also the
      # check that the vendored copy on the unit path does not shadow the
      # package's own in a way that breaks the grammars.
      - name: Every grammar loads
        run: |
          python3 tools/lang2tm.py data/langs data/grammars
          lazbuild --widgetset=nogui tools/langcheck/langcheck.lpi
          ./bin/langcheck data/grammars

  icons:
    name: icons are in step with their generator
    # The icon files are committed so a fresh clone builds without Pillow.
    # This proves they still match tools/make-icon.py, which is the only place
    # the design is written down.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install Pillow
        run: python3 -m pip install --break-system-packages pillow
      - name: Regenerate into a scratch copy
        run: |
          cp -r packaging/icons /tmp/icons-before
          python3 tools/make-icon.py
      # The SVG is text and byte-stable, so it is compared exactly.  The
      # rasters are compared by pixel content instead of by bytes, because a
      # different Pillow version re-encodes the same image differently and a
      # byte diff would fail for no reason anyone can act on.
      - name: Compare against what is committed
        run: python3 tools/check-icons.py /tmp/icons-before
